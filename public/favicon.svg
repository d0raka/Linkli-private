<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f1536f"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="128" ry="128" fill="url(#bgGrad)" />

  <!-- Outer Glass Ring Reflection -->
  <rect x="32" y="32" width="448" height="448" rx="128" ry="128" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.3" />

  <!-- Linkli "Li" Brand Symbol -->
  <text x="140" y="340" font-family="Rubik, sans-serif" font-weight="900" font-size="250" fill="url(#textGrad)" letter-spacing="-10" filter="url(#glow)">Li</text>

  <!-- Sparkling Star Accent -->
  <path d="M 380 120 Q 380 160 420 160 Q 380 160 380 200 Q 380 160 340 160 Q 380 160 380 120 Z" fill="#fbbf24" filter="url(#glow)" />
</svg>
